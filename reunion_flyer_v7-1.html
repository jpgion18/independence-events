<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; flex-direction:column; align-items:center; padding:32px; gap:16px; }

.flyer {
  width:390px; height:693px;
  position:relative; overflow:hidden;
  background:#050000;
}

.bg {
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 90% 70% at 50% 40%, rgba(160,0,0,0.5) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 20% 60%, rgba(100,0,0,0.3) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 60%, rgba(120,0,0,0.25) 0%, transparent 50%),
    radial-gradient(ellipse 100% 50% at 50% 100%, rgba(80,0,0,0.4) 0%, transparent 60%),
    radial-gradient(ellipse 80% 30% at 50% 0%, rgba(60,0,0,0.3) 0%, transparent 50%),
    #050000;
}

.wisps {
  position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(ellipse 15% 60% at 10% 30%, rgba(180,20,0,0.12) 0%, transparent 100%),
    radial-gradient(ellipse 15% 60% at 90% 30%, rgba(180,20,0,0.12) 0%, transparent 100%),
    radial-gradient(ellipse 10% 40% at 25% 70%, rgba(140,10,0,0.1) 0%, transparent 100%),
    radial-gradient(ellipse 10% 40% at 75% 70%, rgba(140,10,0,0.1) 0%, transparent 100%),
    radial-gradient(ellipse 8% 50% at 15% 50%, rgba(100,0,0,0.08) 0%, transparent 100%),
    radial-gradient(ellipse 8% 50% at 85% 50%, rgba(100,0,0,0.08) 0%, transparent 100%);
}

.scan {
  position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0.02;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 3px, #fff 3px, #fff 4px);
}

.rh-logo {
  position:absolute; top:calc(12.5% - 60px); left:50%;
  transform:translateX(-50%);
  width:120px; height:120px; object-fit:contain;
  z-index:3;
  filter:drop-shadow(0 0 14px rgba(200,0,0,0.7));
}
.rf-logo {
  position:absolute; top:calc(87.5% - 44px); left:50%;
  transform:translateX(-50%);
  height:88px; object-fit:contain;
  z-index:3;
  filter:brightness(1.1);
}
</style>
</head>
